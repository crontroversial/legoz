<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Legoz</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>LEGOZ</h1>
<div id="cart">

</div>

    </div>

    <div class="product">
      <div class="lego lego-red"></div>

      <p>2,99 €</p>

    </div>

    <div class="product">
      <div class="lego lego-yellow"></div>
      <h2>Lego Gelb</h2>
      <p>2,99 €</p>
      <button>Kaufen</button>
    </div>

    <div class="product">
      <div class="lego lego-blue"></div>
      <h2>Lego Blau</h2>
      <p>2,99 €</p>
      <button>Kaufen</button>
    </div>

  </main>
<section id="cart-box">
  <h2>Warenkorb</h2>

  <ul id="cart-items"></ul>

  <p id="cart-total">Gesamt: 0,00 €</p>
</section>
  <script src="script.js"></script>

</html>
